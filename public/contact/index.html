.glightbox-container .gtitle,
.glightbox-container .gdesc,
.glightbox-container .gdesc p {
  display: block !important;
  color: #fff !important;
  visibility: visible !important;
  opacity: 1 !important;
}

.gallery-grid{
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(200px,1fr));
  gap:12px;
  margin-top: 1rem;
  padding: 0;
}
.gallery-grid a{
  display:block;
  position:relative;
  overflow:hidden;
  border-radius:4px;
  text-decoration: none;
  color: inherit;
}
.gallery-grid a img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition: transform 0.35s ease;
}

 
.gallery-grid a:hover img{
  transform: scale(1.04);
}

 
.gallery-grid .caption{
  font-style: italic;
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:.6rem .8rem;
  background: linear-gradient(0deg, rgba(0,0,0,0.6), rgba(0,0,0,0.35));
  color:#fff;
  font-size:0.95rem;
  transform:translateY(100%);
  transition: transform 0.22s ease;
  line-height:1.2;
  pointer-events:none;
}

.gallery-grid a:hover .caption,
.gallery-grid a:focus .caption{
  transform:translateY(0);
}

 
.gallery-grid a:focus{
  outline: 3px solid rgba(0,120,210,0.5);
  outline-offset: 3px;
}
</style>
