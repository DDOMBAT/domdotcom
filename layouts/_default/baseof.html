<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ .Title }}</title>
  <link rel="stylesheet" href="/css/style.css">

  <!-- favicon: will use /favicon.svg if present, fallback to /favicon.ico -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico">
</head>
<body>

  <header class="site-header">
    <a href="/" class="brand">
      <img src="/images/DOM-LOGO-2.svg" alt="DomDotCom" class="site-logo" />
      <!--<span class="sr-only">DomDotCom</span> -->
    </a>
  </header>

  <div class="container">
    <nav class="sidebar">
      <a href="/" class="nav-link">Home</a>
      <a href="/portfolio/" class="nav-link">Portfolio</a>
      <a href="/fieldnotes/" class="nav-link">Field Notes</a>
      <a href="/tutoring/" class="nav-link">Tutoring</a>
      <a href="/about/" class="nav-link">About</a>
      <a href="/contact/" class="nav-link">Contact</a>
    </nav>

    <main class="homepage">
      {{ block "main" . }}
      {{ end }}
    </main>
  </div>

</body>
</html>
