<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ .Title }}</title>
  <link rel="stylesheet" href="{{ .Site.BaseURL }}/css/style.css">
  {{ partial "lightbox_head.html" . }}
  <!-- favicon: will use /favicon.svg if present, fallback to /favicon.ico -->
  <link rel="icon" href="{{ .Site.BaseURL }}/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="{{ .Site.BaseURL }}/favicon.ico">
</head>
<body>

  {{ if .IsHome }}
    <!-- Home page: only render the main block (index layout will render the graphic) -->
    <main class="home-only">
      {{ block "main" . }}
      {{ end }}
    </main>
  {{ else }}
    <!-- Not home: render header + sidebar + normal main -->
    <div class="container">
      <nav class="sidebar">
        <a href="{{ .Site.BaseURL }}/" class="nav-link">Home</a>
        <a href="{{ .Site.BaseURL }}/portfolio/" class="nav-link">Portfolio</a>
        <a href="{{ .Site.BaseURL }}/fieldnotes/" class="nav-link">Field Notes</a>
        <a href="{{ .Site.BaseURL }}/consulting/" class="nav-link">Consulting</a>
        <a href="{{ .Site.BaseURL }}/about/" class="nav-link">About</a>
        <a href="{{ .Site.BaseURL }}/contact/" class="nav-link">Contact</a>
      </nav>

      <main class="homepage">
        {{ block "main" . }}
        {{ end }}
      </main>
    </div>
  {{ end }}

  {{ partial "lightbox_scripts.html" . }}
</body>
</html>
