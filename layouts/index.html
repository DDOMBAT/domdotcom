{{ define "main" }}
  <!-- home-specific styles -->
  <link rel="stylesheet" href="{{ "css/home.css" | relURL }}">

  <section class="home-hero">
    <div class="home-graphic">
      <!-- reuse existing logo in /static/images/DOM-LOGO-2.svg -->
      <img src="{{ "images/DOM-LOGO-2.svg" | relURL }}" alt="DomDotCom" />
    </div>

    <!-- inline menu under the splash -->
    <nav class="home-menu">
      {{/* OPTION A: use Hugo's main menu items from config */}}
      {{ if .Site.Menus.main }}
        {{ range .Site.Menus.main }}
          <a href="{{ .URL | relURL }}">{{ .Name }}</a>
        {{ end }}
      {{ else }}
      {{/* OPTION B: fallback hard-coded links if you don't have menus set */}}
        <a href="{{ "Home" | relURL }}">Home</a>
        <a href="{{ "Portfolio" | relURL }}">Portfolio</a>
        <a href="{{ "Consulting" | relURL }}">Consulting</a>
        <a href="{{ "Contact" | relURL }}">Contact</a>
      {{ end }}
    </nav>
  </section>
{{ end }}
